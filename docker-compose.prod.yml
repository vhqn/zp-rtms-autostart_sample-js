# Production deployment with nginx proxy
# 使用方法: docker compose -f docker-compose.prod.yml up -d
version: '3.8'

services:
  # Backend API server - 映射到 9002 供 nginx 代理
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zp-rtms-backend-alex
    ports:
      # 映射到 9002（避免与现有的 9001 冲突）
      - "127.0.0.1:9002:3001"
    env_file:
      - ./.env
    environment:
      # Docker service name overrides
      - FRONTEND_INTERNAL_URL=http://frontend:3000
      - RTMS_SERVER_URL=http://rtms:8080
      - NODE_ENV=production
    volumes:
      # Mount source code for hot reload
      - ./backend:/app:delegated
      # Prevent overwriting node_modules
      - backend-node-modules:/app/node_modules
      # Mount shared .env file
      - ./.env:/app/../.env:ro
    networks:
      - zoom-phone-network
    depends_on:
      - frontend
      - rtms
    restart: unless-stopped

  # Frontend React dev server (内部访问)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zp-rtms-frontend-alex
    env_file:
      - ./.env
    environment:
      - REACT_APP_BACKEND_URL=/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - frontend-node-modules:/app/node_modules
    networks:
      - zoom-phone-network
    stdin_open: true
    tty: true
    restart: unless-stopped

  # RTMS server (内部访问，处理 WebSocket)
  rtms:
    build:
      context: ./rtms
      dockerfile: Dockerfile
    container_name: zp-rtms-server-alex
    platform: linux/amd64
    env_file:
      - ./.env
    environment:
      - PORT=8080
      - BACKEND_URL=http://backend:3001
    volumes:
      - ./rtms:/app:delegated
      - rtms-node-modules:/app/node_modules
      # 数据持久化
      - ./rtms/data:/app/data:delegated
      - ./.env:/app/../.env:ro
    networks:
      - zoom-phone-network
    restart: unless-stopped

networks:
  zoom-phone-network:
    driver: bridge

volumes:
  frontend-node-modules:
  backend-node-modules:
  rtms-node-modules:
