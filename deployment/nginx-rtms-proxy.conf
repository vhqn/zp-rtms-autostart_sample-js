# Zoom Phone RTMS Proxy Configuration
# 添加到 /opt/docker/pbxms/conf/nginx.conf 的 http{} 块中

server {
    listen 3003 ssl;
    server_name qa01zccrtmszone7.zoomdev.us;  # 或使用新的子域名

    # 使用现有的 SSL 证书
    ssl_certificate      ../../zoom_web_api/conf/server.crt;
    ssl_certificate_key  ../../zoom_web_api/conf/server.key;

    # SSL 配置（与现有配置保持一致）
    ssl_protocols        TLSv1.2;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_session_tickets  off;
    ssl_ciphers  'ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers  on;

    # 代理所有请求到你的 Docker backend
    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;

        # WebSocket 支持（RTMS 的 WebSocket 连接必需）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 请求头传递
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（支持长时间的 WebSocket 连接）
        proxy_read_timeout 86400;      # 24小时
        proxy_send_timeout 86400;      # 24小时
        proxy_connect_timeout 60;      # 连接超时 60秒

        # 缓冲配置（优化性能）
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 健康检查端点（可选）
    location /health {
        proxy_pass http://127.0.0.1:9002/health;
        access_log off;
    }
}
