# Zoom Phone RTMS Proxy Configuration for 10.203.64.174
# 添加到 /opt/docker/pbxms/conf/nginx.conf 的 http{} 块末尾

server {
    listen 38.111.222.121:3001 ssl;
    server_name newqa01mszone7.zoomdev.us;

    # SSL 配置（使用现有证书）
    ssl_certificate      ../../zoom_web_api/conf/server.crt;
    ssl_certificate_key  ../../zoom_web_api/conf/server.key;
    ssl_protocols        TLSv1.2;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_session_tickets  off;
    ssl_stapling         on;
    ssl_stapling_verify  on;
    ssl_trusted_certificate  ../../zoom_web_api/conf/server.crt;
    ssl_ciphers  'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers  on;
    ssl_ecdh_curve 'prime256v1:secp384r1';
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;

    # 代理所有请求到 Docker backend
    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;

        # WebSocket 支持（RTMS WebSocket 连接必需）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 请求头传递
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（支持长时间的 WebSocket 连接）
        proxy_read_timeout 86400;      # 24小时
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;

        # 缓冲配置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://127.0.0.1:9001/health;
        access_log off;
    }
}
