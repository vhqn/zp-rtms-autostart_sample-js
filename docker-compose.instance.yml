version: '3.8'

services:
  backend:
    image: zp-rtms-autostart_sample-js-backend:latest
    container_name: zp-rtms-backend-${INSTANCE_PORT}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT}:3001"
    env_file:
      - ./.env
    environment:
      - FRONTEND_INTERNAL_URL=http://frontend:3000
      - RTMS_SERVER_URL=http://rtms:8080
      - NODE_ENV=production
    volumes:
      - ./backend:/app:delegated
      - backend-node-modules:/app/node_modules
      - ./.env:/app/../.env:ro
    networks:
      - zoom-phone-network
    depends_on:
      - frontend
      - rtms
    restart: unless-stopped

  frontend:
    image: zp-rtms-autostart_sample-js-frontend:latest
    container_name: zp-rtms-frontend-${INSTANCE_PORT}
    env_file:
      - ./.env
    environment:
      - REACT_APP_BACKEND_URL=/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - frontend-node-modules:/app/node_modules
    networks:
      - zoom-phone-network
    stdin_open: true
    tty: true
    restart: unless-stopped

  rtms:
    image: zp-rtms-autostart_sample-js-rtms:latest
    container_name: zp-rtms-server-${INSTANCE_PORT}
    platform: linux/amd64
    env_file:
      - ./.env
    environment:
      - PORT=8080
      - BACKEND_URL=http://backend:3001
      - RTMS_DATA_DIR=/app/data
    volumes:
      - ./rtms:/app:delegated
      - rtms-node-modules:/app/node_modules
      - /home/rtms:/app/data:delegated
      - ./.env:/app/../.env:ro
    networks:
      - zoom-phone-network
    restart: unless-stopped

networks:
  zoom-phone-network:
    driver: bridge

volumes:
  frontend-node-modules:
  backend-node-modules:
  rtms-node-modules:
